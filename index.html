<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolsápolis</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1626;
        --panel: #16223a;
        --ink: #e8eefc;
        --muted: #8aa0c6;
        --up: #37d67a;
        --down: #ff5d6c;
        --gold: #f4c430;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid #24324f;
      }
      header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
      header .tag { font-size: 12px; color: var(--muted); }
      main { flex: 1; display: flex; min-height: 0; }
      #game { flex: 1; min-width: 0; }
      aside {
        width: 300px;
        background: var(--panel);
        border-left: 1px solid #24324f;
        padding: 14px;
        overflow-y: auto;
      }
      .stat { margin-bottom: 14px; }
      .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
      .stat .value { font-size: 22px; font-weight: 700; }
      .holding {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 0; border-bottom: 1px solid #24324f; font-variant-numeric: tabular-nums;
      }
      .holding .sym { font-weight: 700; }
      .holding .chg.up { color: var(--up); }
      .holding .chg.down { color: var(--down); }
      button {
        width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px;
        background: var(--gold); color: #1a1300; font-weight: 700; cursor: pointer; font-size: 14px;
      }
      button.ghost { background: #24324f; color: var(--ink); }
      footer { padding: 6px 16px; font-size: 11px; color: var(--muted); background: var(--panel); border-top: 1px solid #24324f; }
      @media (max-width: 720px) {
        main { flex-direction: column; }
        aside { width: 100%; border-left: 0; border-top: 1px solid #24324f; max-height: 40%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🏛️ Bolsápolis</h1>
        <span class="tag">tu portafolio es tu imperio — MVP v0.1</span>
      </header>
      <main>
        <div id="game"></div>
        <aside id="panel"></aside>
      </main>
      <footer id="ticker">Mercado abriendo…</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
